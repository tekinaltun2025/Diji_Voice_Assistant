name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build the shared package
        run: npm run build:shared

      - name: Build the agent
        run: npm run build:agent

      - name: Build the MCP servers
        run: npm run build:mcp

      - name: Type check (agent)
        run: npx tsc --noEmit -p agent/tsconfig.json
        continue-on-error: false

      - name: Unit tests (jest)
        # The root jest.config.js provides the `projects` definition that
        # includes the agent project. Do NOT set `working-directory: agent`:
        # the root configuration would then be ignored.
        run: npx jest --ci --silent

      - name: Smoke test (parts that need no models)
        run: node scripts/smoke-test.js --skip-audio

      - name: Lint
        run: npm run lint
        continue-on-error: true

  ui-build:
    name: UI build
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build the shared package
        run: npm run build:shared

      - name: Next.js build (static export)
        working-directory: ui
        run: npx next build

      - name: Build the Electron main process
        working-directory: ui
        run: npx tsc -p electron/tsconfig.json
